<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sketch — same markup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../sketch/css/sketch.css">
  <style>
    /* Identical layout for every pack — only the class prefix changes. */
    body { margin: 0; min-height: 100vh; }
    .wrap { padding: 22px; }
    .spec { display: flex; flex-direction: column; gap: 16px; }
    .line { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .line--start { justify-content: flex-start; flex-wrap: wrap; }
  </style>
</head>
<body>
<div class="wrap">
  <article class="sketch-card spec">
    <div class="line"><h3 class="sketch-card__title">Weekly report</h3><span class="sketch-badge sketch-badge--updated">Ready</span></div>
    <p class="sketch-card__text">Send the summary to your team every Monday at 9:00.</p>
    <div class="sketch-segmented sketch-segmented--block" role="tablist" aria-label="Frequency">
      <button class="sketch-segmented__item" role="tab" aria-selected="false" tabindex="-1">Daily</button>
      <button class="sketch-segmented__item" role="tab" aria-selected="true">Weekly</button>
      <button class="sketch-segmented__item" role="tab" aria-selected="false" tabindex="-1">Monthly</button>
    </div>
    <input class="sketch-input" value="team@northwind.com" aria-label="Recipients">
    <label class="line">Include charts<input type="checkbox" class="sketch-toggle" checked></label>
    <div class="line line--start"><button class="sketch-btn sketch-btn--primary" type="button">Schedule</button><button class="sketch-btn" type="button">Preview</button></div>
  </article>
</div>
<script src="../../sketch/js/sketch.js"></script>
</body>
</html>
