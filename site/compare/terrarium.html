<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terrarium — same markup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0..100,0..1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../terrarium/css/terrarium.css">
  <style>
    /* Identical layout for every pack — only the class prefix changes. */
    body { margin: 0; min-height: 100vh; }
    .wrap { padding: 22px; }
    .spec { display: flex; flex-direction: column; gap: 16px; }
    .line { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .line--start { justify-content: flex-start; flex-wrap: wrap; }
  </style>
</head>
<body>
<div class="wrap">
  <article class="terrarium-card spec">
    <div class="line"><h3 class="terrarium-title">Weekly report</h3><span class="terrarium-badge terrarium-badge--active">Ready</span></div>
    <p class="terrarium-caption">Send the summary to your team every Monday at 9:00.</p>
    <div class="terrarium-segmented terrarium-segmented--block" role="tablist" aria-label="Frequency">
      <button class="terrarium-segmented__item" role="tab" aria-selected="false" tabindex="-1">Daily</button>
      <button class="terrarium-segmented__item" role="tab" aria-selected="true">Weekly</button>
      <button class="terrarium-segmented__item" role="tab" aria-selected="false" tabindex="-1">Monthly</button>
    </div>
    <input class="terrarium-input" value="team@northwind.com" aria-label="Recipients">
    <label class="line">Include charts<input type="checkbox" class="terrarium-switch terrarium-switch--sm" checked></label>
    <div class="line line--start"><button class="terrarium-btn terrarium-btn--primary" type="button">Schedule</button><button class="terrarium-btn" type="button">Preview</button></div>
  </article>
</div>
<script src="../../terrarium/js/terrarium.js"></script>
</body>
</html>
