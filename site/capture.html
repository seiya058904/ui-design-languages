<!doctype html>
<html lang="en" data-site-theme="booth">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homepage stills</title>
  <meta name="robots" content="noindex">
  <!-- Site chrome: renders the homepage's tray tiles and "Same markup" cards live, so that
       `node scripts/snap.mjs --thumbs=home` can photograph them into site/assets/home/. The homepage shows those
       stills until #live and #same hydrate (when either comes near the viewport, or the page is idle after load):
       only then does site/wall.js link the packs' CSS and JS, so nothing live competes with the first paint.
       Each still is taken in the box its live stage gets on a 1440px homepage (site.css: tray tile 428 × 400,
       wide tile 872 × 400, card 428 × 448, same padding), so swapping one for the other moves nothing.
       The picks are read from index.html (.tray__item[data-pick], [data-compare]).
       site/wall.js resolves packs.json and every pack from the site root, so this page sets a root
       <base> first and adds its own stylesheet and scripts after it. -->
  <script>
    (function () {
      var base = document.createElement("base");
      base.href = new URL("../", location.href).href;
      document.head.appendChild(base);
      var css = document.createElement("link");
      css.rel = "stylesheet"; css.setAttribute("href", "site/site.css"); // resolved against the root <base>
      document.head.appendChild(css);
      ["site/wall.js", "site/capture.js"].forEach(function (src) {
        var s = document.createElement("script");
        s.src = src; s.async = false;
        document.head.appendChild(s);
      });
    })();
  </script>
  <style>
    body { padding: 24px; background: #C9C9C6; }
    .cap { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px; }
    /* = .tray__stage on the homepage at 1440px: a stage container, 400px tall, the live stage's padding */
    .cap-tile { display: flex; width: 428px; height: 400px; container-type: inline-size; }
    .cap-tile--wide { width: 872px; }
    .cap-tile .wstage { flex: 1; min-height: 0; padding: 28px 24px 64px; border-radius: 0; }
    /* = .same__view at 1440px: 448px tall, the live stage's padding, the card as wide as on its live stage */
    .cap-same { width: 428px; }
    .cap-same .same__inner { height: 448px; padding: 26px 20px !important; }
    .cap-same .same__inner > article { width: min(100%, 360px); margin: 0 auto; }
  </style>
</head>
<body>
<div class="cap" data-cap></div>
</body>
</html>
