<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clay — same markup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../clay/css/clay.css">
  <style>
    /* Identical layout for every pack — only the class prefix changes. */
    body { margin: 0; min-height: 100vh; }
    .wrap { padding: 0; }
    .spec { display: flex; flex-direction: column; gap: 16px; }
    .line { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .line--start { justify-content: flex-start; flex-wrap: wrap; }
  </style>
</head>
<body>
<div class="wrap"><div class="clay-board" style="padding:22px;border-radius:0;min-height:100vh">
  <article class="clay-card clay-card--column spec">
    <div class="line"><h3 class="clay-card__title">Weekly report</h3><span class="clay-badge clay-badge--success">Ready</span></div>
    <p class="clay-card__text">Send the summary to your team every Monday at 9:00.</p>
    <div class="clay-segmented clay-segmented--block" role="tablist" aria-label="Frequency">
      <button class="clay-segmented__item" role="tab" aria-selected="false" tabindex="-1">Daily</button>
      <button class="clay-segmented__item" role="tab" aria-selected="true">Weekly</button>
      <button class="clay-segmented__item" role="tab" aria-selected="false" tabindex="-1">Monthly</button>
    </div>
    <input class="clay-input" value="team@northwind.com" aria-label="Recipients">
    <label class="line">Include charts<input type="checkbox" class="clay-toggle" checked></label>
    <div class="line line--start"><button class="clay-btn clay-btn--primary" type="button">Schedule</button><button class="clay-btn" type="button">Preview</button></div>
  </article>
</div></div>
<script src="../../clay/js/clay.js"></script>
</body>
</html>
