<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Obsidian — same markup</title>
  <link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"></noscript>
  <link rel="stylesheet" href="../../obsidian/css/obsidian.css">
  <style>
    /* Identical layout for every pack — only the class prefix changes. */
    body { margin: 0; min-height: 100vh; }
    .wrap { padding: 22px; }
    .spec { display: flex; flex-direction: column; gap: 16px; }
    .line { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .line--start { justify-content: flex-start; flex-wrap: wrap; }
  </style>
</head>
<body>
<main class="wrap">
  <article class="obsidian-card spec">
    <div class="line"><h3 class="obsidian-card__title">Weekly report</h3><span class="obsidian-badge obsidian-badge--success">Ready</span></div>
    <p class="obsidian-card__text">Send the summary to your team every Monday at 9:00.</p>
    <div class="obsidian-segmented obsidian-segmented--block" role="tablist" aria-label="Frequency">
      <button class="obsidian-segmented__item" role="tab" aria-selected="false" tabindex="-1">Daily</button>
      <button class="obsidian-segmented__item" role="tab" aria-selected="true">Weekly</button>
      <button class="obsidian-segmented__item" role="tab" aria-selected="false" tabindex="-1">Monthly</button>
    </div>
    <input class="obsidian-input" value="team@northwind.com" aria-label="Recipients">
    <label class="line">Include charts<input type="checkbox" class="obsidian-switch" checked></label>
    <div class="line line--start"><button class="obsidian-btn obsidian-btn--primary" type="button">Schedule</button><button class="obsidian-btn" type="button">Preview</button></div>
  </article>
</main>
<script src="../../obsidian/js/obsidian.js"></script>
</body>
</html>
